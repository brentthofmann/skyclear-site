<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!-- Static stand-in so Netlify's build bot ALWAYS detects the "quote" form
         and every field. The real (React) form on the site posts to Netlify
         with form-name=quote, which matches this. Hidden from users. -->
    <form name="quote" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service"><option></option></select>
      <input type="text" name="location" />
      <input type="text" name="preferredContact" />
      <input type="text" name="source" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
  </body>
</html>
